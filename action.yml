name: 'BMake'
description: 'Build any project using its BMake.bm configuration'
author: 'Zoder-Studio'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  file:
    description: 'Path to a specific .bm file (optional, auto-detected if omitted)'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing the .bm file'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache BMake CLI build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ github.action_path }}/target
        key: bmake-cli-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', github.action_path)) }}

    - name: Build BMake CLI
      shell: bash
      run: cargo build --release --manifest-path "${{ github.action_path }}/Cargo.toml" -p bmake-cli

    - name: Check BMake
      shell: bash
      run: ls

    - name: Run BMake
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        BMAKE_BIN="${{ github.action_path }}/target/release/bmake"
        if [ -n "${{ inputs.file }}" ]; then
          "$BMAKE_BIN" run "${{ inputs.file }}"
        else
          "$BMAKE_BIN" run
        fi