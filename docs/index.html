<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BMake Control Plane</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; }
  header { padding:1rem 1.5rem; border-bottom:1px solid #21262d; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.1rem; margin:0; }
  main { padding:1.5rem; max-width:960px; margin:0 auto; }
  .card { background:#161b22; border:1px solid #21262d; border-radius:8px; padding:1rem; margin-bottom:1rem; }
  input, button { font-size:0.95rem; padding:0.5rem 0.7rem; border-radius:6px; border:1px solid #30363d; background:#0d1117; color:#c9d1d9; }
  button { cursor:pointer; background:#238636; border-color:#2ea043; }
  button.secondary { background:#21262d; }
  table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  th, td { text-align:left; padding:0.4rem 0.5rem; border-bottom:1px solid #21262d; }
  .status-ONLINE { color:#3fb950; }
  .status-OFFLINE { color:#8b949e; }
  .status-BUSY { color:#d29922; }
  .status-ERROR, .status-FAILED { color:#f85149; }
  .status-SUCCESS { color:#3fb950; }
  .tabs { display:flex; gap:0.5rem; margin-bottom:1rem; }
  .tabs button.active { outline:2px solid #58a6ff; }
  pre { background:#010409; padding:0.75rem; border-radius:6px; overflow:auto; max-height:400px; font-size:0.8rem; }
  #login-view, #app-view { display:none; }
</style>
</head>
<body>
<header>
  <h1>BMake Control Plane</h1>
  <div id="user-box"></div>
</header>
<main>
  <div id="login-view" class="card">
    <h2>Sign in</h2>
    <p>Same account you use with <code>bmake login</code>.</p>
    <div style="display:flex; flex-direction:column; gap:0.5rem; max-width:320px;">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="doLogin()">Sign in</button>
      <div id="login-error" style="color:#f85149;"></div>
    </div>
  </div>

  <div id="app-view">
    <div class="tabs">
      <button id="tab-runners" onclick="showTab('runners')" class="active">Runners</button>
      <button id="tab-builds" onclick="showTab('builds')">Builds</button>
    </div>

    <div id="view-runners" class="card">
      <h2>Runners</h2>
      <table>
        <thead><tr><th>Name</th><th>Runs-on</th><th>Version</th><th>Arch</th><th>Status</th><th>ID</th></tr></thead>
        <tbody id="runners-body"></tbody>
      </table>
    </div>

    <div id="view-builds" class="card" style="display:none;">
      <h2>Builds</h2>
      <table>
        <thead><tr><th>Status</th><th>Runs-on</th><th>Started</th><th>Duration</th><th></th></tr></thead>
        <tbody id="builds-body"></tbody>
      </table>
      <div id="build-detail"></div>
    </div>
  </div>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Fill these in with your own Supabase project (see supabase/schema.sql).
  const SUPABASE_URL = 'https://bqtexxwyabicspfbpalf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxdGV4eHd5YWJpY3NwZmJwYWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NTY3MTMsImV4cCI6MjEwMjQzMjcxM30.r6igXYU197wzWy-RB_unhnqoLRDJEZqW6nXoMY3tADc';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function refreshUserBox() {
    const { data: { session } } = await supabase.auth.getSession();
    const box = document.getElementById('user-box');
    if (session) {
      box.innerHTML = `${session.user.email} <button class="secondary" onclick="doLogout()">Sign out</button>`;
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      await loadRunners();
      await loadBuilds();
    } else {
      box.innerHTML = '';
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('app-view').style.display = 'none';
    }
  }

  window.doLogin = async function () {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    document.getElementById('login-error').textContent = error ? error.message : '';
    if (!error) await refreshUserBox();
  };

  window.doLogout = async function () {
    await supabase.auth.signOut();
    await refreshUserBox();
  };

  window.showTab = function (name) {
    document.getElementById('tab-runners').classList.toggle('active', name === 'runners');
    document.getElementById('tab-builds').classList.toggle('active', name === 'builds');
    document.getElementById('view-runners').style.display = name === 'runners' ? 'block' : 'none';
    document.getElementById('view-builds').style.display = name === 'builds' ? 'block' : 'none';
  };

  async function loadRunners() {
    const { data, error } = await supabase.from('runners').select('*').order('created_at', { ascending: false });
    const body = document.getElementById('runners-body');
    body.innerHTML = '';
    if (error) { body.innerHTML = `<tr><td colspan="6">${error.message}</td></tr>`; return; }
    for (const r of data) {
      body.innerHTML += `<tr>
        <td>${r.name}</td><td>${r.runs_on}</td><td>${r.version}</td><td>${r.arch}</td>
        <td class="status-${r.status}">${r.status}</td>
        <td><code>${r.id}</code></td>
      </tr>`;
    }
  }

  async function loadBuilds() {
    const { data, error } = await supabase.from('builds').select('*').order('created_at', { ascending: false }).limit(50);
    const body = document.getElementById('builds-body');
    body.innerHTML = '';
    if (error) { body.innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`; return; }
    for (const b of data) {
      body.innerHTML += `<tr>
        <td class="status-${b.status}">${b.status}</td>
        <td>${b.runs_on || ''} ${b.runs_on_version || ''}</td>
        <td>${b.start_time || b.created_at}</td>
        <td>${b.duration_secs ?? ''}</td>
        <td><button class="secondary" onclick="showBuild('${b.id}')">Logs</button></td>
      </tr>`;
    }
  }

  window.showBuild = async function (buildId) {
    const { data, error } = await supabase.from('build_logs').select('line').eq('build_id', buildId).order('id', { ascending: true });
    const detail = document.getElementById('build-detail');
    if (error) { detail.innerHTML = `<p>${error.message}</p>`; return; }
    detail.innerHTML = `<h3>Build ${buildId}</h3><pre>${data.map(r => r.line).join('\n')}</pre>`;
  };

  refreshUserBox();
</script>
</body>
</html>
