<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BMake Control Plane</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>BMake Control Plane</h1>
  <div id="user-box"></div>
</header>
<main>
  <div id="login-view" class="card">
    <h2>Sign in</h2>
    <p>Same account you use with <code>bmake login</code>.</p>
    <div class="form-column">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="doLogin()">Sign in</button>
      <div id="login-error" class="error-text"></div>
    </div>
  </div>

  <div id="app-view">
    <div class="tabs">
      <button id="tab-runners" onclick="showTab('runners')" class="active">Runners</button>
      <button id="tab-builds" onclick="showTab('builds')">Builds</button>
      <button id="tab-secrets" onclick="showTab('secrets')">Secrets</button>
    </div>

    <div id="view-runners" class="card">
      <h2>Runners</h2>
      <table>
        <thead><tr><th>Name</th><th>Runs-on</th><th>Version</th><th>Arch</th><th>Status</th><th>ID</th></tr></thead>
        <tbody id="runners-body"></tbody>
      </table>
    </div>

    <div id="view-builds" class="card" style="display:none;">
      <h2>Builds</h2>
      <table>
        <thead><tr><th>Status</th><th>Runs-on</th><th>Started</th><th>Duration</th><th></th></tr></thead>
        <tbody id="builds-body"></tbody>
      </table>
      <div id="build-detail"></div>
    </div>

    <div id="view-secrets" class="card" style="display:none;">
      <h2>Secrets</h2>
      <p class="muted">Values are never shown again after saving — only names.</p>

      <div class="secret-forms">
        <div class="secret-form">
          <h3>Add secret</h3>
          <div class="form-column">
            <input id="secret-name" placeholder="Secret name" />
            <input id="secret-value" type="password" placeholder="Secret value" />
            <button onclick="addSecret()">Add Secret</button>
            <div id="secret-add-error" class="error-text"></div>
          </div>
        </div>

        <div class="secret-form">
          <h3>Grant to Runner</h3>
          <div class="form-column">
            <input id="grant-secret-name" placeholder="Secret name" />
            <input id="grant-runner-id" placeholder="Runner ID" />
            <button onclick="grantSecret()">Grant Access</button>
            <div id="secret-grant-error" class="error-text"></div>
          </div>
        </div>
      </div>

      <h3 class="secrets-list-heading">Existing secrets</h3>
      <table>
        <thead><tr><th>Name</th></tr></thead>
        <tbody id="secrets-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module" src="script.js"></script>
</body>
</html>
